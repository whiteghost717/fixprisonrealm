
name: Build PrisonRealm

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build PrisonRealm
        shell: bash
        run: |
          if [ -f "PrisonRealm/build.gradle" ]; then
            cd PrisonRealm
          elif [ -f "build.gradle" ]; then
            echo "Building from repository root"
          else
            echo "ERROR: build.gradle not found"
            find . -maxdepth 5 -name build.gradle
            exit 1
          fi

          gradle build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrisonRealm-JAR
          path: |
            PrisonRealm/build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: error
